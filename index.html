<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Frog Home</title>

<style>

html,body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#frog {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    border:0;
}

/* 通知 */

#notification {

    position:fixed;

    top:18px;
    right:18px;

    width:330px;
    max-width:34vw;

    padding:14px 17px;

    box-sizing:border-box;

    border-radius:18px;

    background:rgba(20,20,20,.55);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    color:white;

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

    z-index:10;

    transition:.25s;

}

#app {

    font-size:12px;
    opacity:.65;
    margin-bottom:4px;

}

#title {

    font-size:17px;
    font-weight:600;
    margin-bottom:5px;

}

#body {

    font-size:14px;
    line-height:1.4;
    opacity:.9;

}

#empty {

    font-size:14px;
    opacity:.65;

}

</style>

</head>

<body>

<iframe
    id="frog"
    src="https://weather.r0rt1z2.com/">
</iframe>


<div id="notification">

    <div id="empty">
        通知はありません
    </div>

    <div id="content"
         style="display:none;">

        <div id="app"></div>

        <div id="title"></div>

        <div id="body"></div>

    </div>

</div>


<script>

/* ここだけ変更 */

const GAS_URL =
"https://script.google.com/macros/s/AKfycbx6X6JNNyyAexzBKZmLiI-Mr3QRuh6jPMNfkpJNKbfyKFHZIfwWEjN4ejymCRLJnjq08Q/exec";


let lastTime = 0;


function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;

}


function showNotification(data) {

    document.getElementById("empty")
        .style.display = "none";

    document.getElementById("content")
        .style.display = "block";


    document.getElementById("app")
        .innerHTML =
        escapeHTML(data.app);


    document.getElementById("title")
        .innerHTML =
        escapeHTML(data.title);


    document.getElementById("body")
        .innerHTML =
        escapeHTML(data.body);

}


function clearNotification() {

    document.getElementById("content")
        .style.display = "none";

    document.getElementById("empty")
        .style.display = "block";

}


async function checkNotification() {

    try {

        const response =
            await fetch(
                GAS_URL +
                "?t=" +
                Date.now()
            );

        const data =
            await response.json();


        if (
            data.time &&
            data.time !== lastTime
        ) {

            lastTime =
                data.time;

            showNotification(data);

        }


    } catch(error) {

        console.log(error);

    }

}


/* 2秒ごとに確認 */

setInterval(
    checkNotification,
    2000
);

checkNotification();

</script>

</body>

</html>
