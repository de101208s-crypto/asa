
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
  >

  <title>Frog Home</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* カエル天気画面 */
    #frog {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    /* 通知パネル */
    #notification {
      position: fixed;
      top: 18px;
      right: 18px;

      width: 330px;
      max-width: 34vw;

      padding: 14px 17px;

      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;

      background: rgba(20, 20, 20, 0.58);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      color: #fff;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      box-shadow:
        0 5px 25px rgba(0, 0, 0, 0.22);

      z-index: 100;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    /* 通知なし */
    #empty {
      font-size: 14px;
      line-height: 1.4;
      color: rgba(255, 255, 255, 0.65);
    }

    /* 通知あり */
    #content {
      display: none;
    }

    #app {
      margin-bottom: 4px;

      font-size: 12px;
      line-height: 1.3;

      color: rgba(255, 255, 255, 0.65);
    }

    #title {
      margin-bottom: 5px;

      font-size: 17px;
      font-weight: 600;
      line-height: 1.35;

      overflow-wrap: anywhere;
    }

    #body {
      font-size: 14px;
      line-height: 1.45;

      color: rgba(255, 255, 255, 0.9);

      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    /* 画面が狭い場合 */
    @media (max-width: 700px) {
      #notification {
        top: 10px;
        right: 10px;

        width: 280px;
        max-width: calc(100vw - 20px);

        padding: 11px 13px;
        border-radius: 14px;
      }

      #title {
        font-size: 15px;
      }

      #body {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <!-- カエルの天気画面 -->
  <iframe
    id="frog"
    src="https://weather.r0rt1z2.com/"
    title="Frog Weather"
    allowfullscreen>
  </iframe>

  <!-- 通知エリア -->
  <div id="notification">

    <!-- 通知がない場合 -->
    <div id="empty">
      通知はありません
    </div>

    <!-- 通知がある場合 -->
    <div id="content">

      <div id="app"></div>

      <div id="title"></div>

      <div id="body"></div>

    </div>

  </div>

  <script>

    /*
     * ======================================
     * Google Apps ScriptのURL
     * ======================================
     *
     * 自分のGASの /exec URLに変更する。
     */

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbx6X6JNNyyAexzBKZmLiI-Mr3QRuh6jPMNfkpJNKbfyKFHZIfwWEjN4ejymCRLJnjq08Q/exec";

    /*
     * 最後に表示した通知の時刻
     */

    let lastTime = 0;

    /*
     * HTMLエスケープ
     *
     * 通知本文にHTMLが含まれていても、
     * 画面のコードとして実行されないようにする。
     */

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text || "";

      return div.innerHTML;

    }

    /*
     * 通知を表示
     */

    function showNotification(data) {

      document.getElementById("empty")
        .style.display = "none";

      document.getElementById("content")
        .style.display = "block";

      document.getElementById("app")
        .innerHTML =
        escapeHTML(data.app);

      document.getElementById("title")
        .innerHTML =
        escapeHTML(data.title);

      document.getElementById("body")
        .innerHTML =
        escapeHTML(data.body);

    }

    /*
     * 通知なし表示に戻す
     */

    function clearNotification() {

      document.getElementById("content")
        .style.display = "none";

      document.getElementById("empty")
        .style.display = "block";

    }

    /*
     * Google Apps Scriptから通知を取得
     *
     * JSONPを使用するため、
     * GitHub PagesからGASへアクセスできる。
     */

    function checkNotification() {

      const callbackName =
        "gasCallback_" + Date.now();

      /*
       * JSONPのコールバック関数
       */

      window[callbackName] = function(data) {

        if (
          data &&
          data.time &&
          data.time !== lastTime
        ) {

          lastTime =
            data.time;

          showNotification(data);

        }

        /*
         * 使用済みscriptタグを削除
         */

        const script =
          document.getElementById(callbackName);

        if (script) {
          script.remove();
        }

        /*
         * グローバル関数を削除
         */

        delete window[callbackName];

      };

      /*
       * GASのJSONP URLを作成
       */

      const url =
        GAS_URL +
        "?callback=" +
        encodeURIComponent(callbackName) +
        "&t=" +
        Date.now();

      /*
       * scriptタグでGASを呼び出す
       */

      const script =
        document.createElement("script");

      script.id =
        callbackName;

      script.src =
        url;

      /*
       * 通信エラー時の処理
       */

      script.onerror = function() {

        script.remove();

        delete window[callbackName];

        console.log(
          "Google Apps Scriptへの接続に失敗しました"
        );

      };

      document.body.appendChild(script);

    }

    /*
     * 2秒ごとに通知を確認
     */

    setInterval(
      checkNotification,
      2000
    );

    /*
     * ページを開いた直後にも確認
     */

    checkNotification();

  </script>

</body>
</html>
